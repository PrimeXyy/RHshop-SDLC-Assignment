name: rhshop

services:
  postgres:
    image: postgres:16-alpine
    container_name: rhshop-postgres
    restart: always
    environment:
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
      POSTGRES_DB: shopdb
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rhshop-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rhshop-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://shopuser:shoppass@postgres:5432/shopdb?schema=public
      JWT_SECRET: supersecret_jwt_key_sdlc_2026_antigravity
      CLIENT_URL: http://localhost:3000
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rhshop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rhshop-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rhshop-network

volumes:
  postgres_data:
    driver: local

networks:
  rhshop-network:
    driver: bridge
